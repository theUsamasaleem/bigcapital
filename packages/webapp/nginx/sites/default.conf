server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    # Content-hashed build assets: safe to cache forever.
    # A MISSING asset must 404 (NOT fall back to index.html) — otherwise a stale
    # chunk request returns HTML, the dynamic import fails, and the SPA reloads
    # in an infinite loop after every deploy.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routes: serve the app shell for client-side routes (e.g. /invoices/new).
    location / {
        try_files $uri /index.html;
    }

    # Never cache the app shell, so a new deploy (with new chunk hashes) is always
    # picked up on the next navigation instead of loading a stale index.html.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
