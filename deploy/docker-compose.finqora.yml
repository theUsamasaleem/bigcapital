# Finqora self-host stack — builds the server + webapp from THIS repo
# (not the stock bigcapitalhq/* images), so your customizations ship.
#
# The Envoy proxy is bound to 127.0.0.1:8080 only — it is NOT exposed to the
# network. A Cloudflare Tunnel (cloudflared) connects to http://localhost:8080
# and provides the public HTTPS URL. Nothing needs port-forwarding.
#
# Usage (from the repo root):
#   docker compose -f deploy/docker-compose.finqora.yml --env-file deploy/.env build
#   docker compose -f deploy/docker-compose.finqora.yml --env-file deploy/.env up -d mysql redis
#   # wait ~20s for MySQL, then run migrations once:
#   docker compose -f deploy/docker-compose.finqora.yml --env-file deploy/.env run --rm server \
#       node packages/server/dist/cli.js system:migrate:latest
#   docker compose -f deploy/docker-compose.finqora.yml --env-file deploy/.env up -d

services:
  proxy:
    image: envoyproxy/envoy:v1.30-latest
    depends_on:
      - server
      - webapp
    # Bound to localhost only — Cloudflare Tunnel reaches it here.
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ../docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml
    restart: unless-stopped
    networks:
      - finqora_network
    mem_limit: 256m

  webapp:
    container_name: finqora-webapp
    build:
      context: ..
      dockerfile: packages/webapp/Dockerfile
    restart: unless-stopped
    networks:
      - finqora_network
    mem_limit: 256m

  server:
    container_name: finqora-server
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    expose:
      - '3000'
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - finqora_network
    mem_limit: 1536m
    environment:
      # Authentication
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}

      # Application
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=${BASE_URL}

      # Database (talks to the mysql service over the internal network)
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}

      # Redis + BullMQ queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}

      # Sign-up
      - SIGNUP_DISABLED=${SIGNUP_DISABLED}
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION}

      # Gotenberg (PDF/printing)
      - GOTENBERG_URL=http://gotenberg:3000
      - GOTENBERG_DOCS_URL=http://server:3000/public/

      # Exchange rate
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}

      # S3 (placeholders let the Attachments module boot; real uploads need real S3)
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_FORCE_PATH_STYLE=true

      - HOSTED_ON_BIGCAPITAL_CLOUD=false

  mysql:
    container_name: finqora-mysql
    build:
      context: ../docker/mariadb
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - '3306'
    networks:
      - finqora_network
    mem_limit: 1024m

  redis:
    container_name: finqora-redis
    build:
      context: ../docker/redis
    restart: unless-stopped
    expose:
      - '6379'
    volumes:
      - redis:/data
    networks:
      - finqora_network
    mem_limit: 256m

  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - finqora_network
    mem_limit: 512m

volumes:
  mysql:
    name: finqora_prod_mysql
    driver: local
  redis:
    name: finqora_prod_redis
    driver: local

networks:
  finqora_network:
    driver: bridge
